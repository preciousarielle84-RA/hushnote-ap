<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hushnote - Messages Anonymes</title>
    <style>
        body { font-family: sans-serif; background: #faf5f0; padding: 20px; }
        .card { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        textarea, input { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background: #d81b60; color: white; border: none; padding: 12px; margin-top: 12px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🤫 Laisse-moi un message anonyme</h2>
        <textarea id="content" placeholder="Ton message secret..."></textarea>
        <input type="text" id="sender_hint" placeholder="Un indice (optionnel)">
        <button onclick="send()">Envoyer</button>
    </div>

    <script>
        async function send() {
            const content = document.getElementById('content').value;
            const sender_hint = document.getElementById('sender_hint').value;
            const urlParams = new URLSearchParams(window.location.search);
            const username = urlParams.get('u') || 'arielle';

            if(!content) return alert("Écris un message !");

            const res = await fetch('/api/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, content, sender_hint })
            });
            const data = await res.json();
            if(data.success) {
                alert("Message envoyé !");
                document.getElementById('content').value = '';
            } else {
                alert(data.error);
            }
        }
    </script>
</body>
</html>
